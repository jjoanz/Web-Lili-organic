<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda — Lili Organic</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --purple:#652C83; --purple-deep:#4a1f61; --coral:#C04F4C;
    --ivory:#FDFBF8; --sage:#7C8B65; --ink:#2B1F33; --line:#EAE3DC; --card:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Montserrat',sans-serif; background:var(--ivory); color:var(--ink); -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}

  /* NAV (igual a index.html) */
  .nav{display:flex; align-items:center; justify-content:space-between; padding:1.1rem 3rem; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(253,251,248,.94); backdrop-filter:blur(6px); z-index:50;}
  .nav-logo img{height:42px; width:auto;}
  .nav-links{display:flex; gap:2rem; font-size:.83rem; font-weight:600;}
  .nav-links a{opacity:.7; transition:opacity .2s;}
  .nav-links a:hover, .nav-links a.on{opacity:1; color:var(--purple);}
  .nav-icons{display:flex; gap:1.1rem; font-size:1.05rem; align-items:center;}
  #marketSwitcherContainer{font-size:.8rem;}
  .cart-dot{position:relative;}
  .cart-dot .badge-count{position:absolute; top:-8px; right:-10px; background:var(--coral); color:#fff; font-size:.62rem; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .nav-toggle{display:none; font-size:1.2rem; cursor:pointer;}

  .page-header{max-width:1400px; margin:0 auto; padding:2.5rem 3rem 0;}
  .eyebrow{font-size:.7rem; letter-spacing:.3em; text-transform:uppercase; color:var(--sage); font-weight:700; margin-bottom:.5rem;}
  .page-header h1{font-family:'Playfair Display',serif; font-weight:700; font-size:2rem;}

  .shop{display:grid; grid-template-columns:240px 1fr; gap:2.5rem; max-width:1400px; margin:0 auto; padding:1.5rem 3rem 5rem;}

  .filters h3{font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); font-weight:700; margin:1.75rem 0 .9rem;}
  .filters h3:first-child{margin-top:0;}
  .filter-group{display:flex; flex-direction:column; gap:.6rem;}
  .filter-item{display:flex; align-items:center; justify-content:space-between; font-size:.85rem; color:#5c5460; cursor:pointer; padding:.15rem 0; transition:color .15s; background:none; border:none; text-align:left; width:100%; font-family:inherit;}
  .filter-item:hover, .filter-item.active{color:var(--purple); font-weight:600;}
  .filter-item span.count{font-size:.7rem; color:#a99fb0; font-weight:500;}
  .filter-item.active span.count{color:var(--purple);}
  .filter-divider{height:1px; background:var(--line); margin:1.5rem 0 0;}

  .grid-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;}
  .grid-header h2{font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:700;}
  .grid-header p{font-size:.8rem; color:#8a8090;}
  .sort-select, .search-input{padding:.55rem 1rem; border:1.5px solid var(--line); border-radius:.6rem; font-family:inherit; font-size:.8rem; font-weight:600; background:#fff; color:var(--ink);}
  .search-input{width:100%; margin-bottom:1.5rem; font-weight:500;}

  .product-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:1.5rem;}
  .card{background:var(--card); border-radius:1.1rem; overflow:hidden; border:1px solid var(--line); transition:box-shadow .25s, transform .25s; display:flex; flex-direction:column;}
  .card:hover{box-shadow:0 18px 40px rgba(101,44,131,.13); transform:translateY(-3px);}
  .card-media{aspect-ratio:1/1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#8a8090; font-weight:600; font-size:.9rem; text-align:center; padding:1rem; background:#E8E2D8;}
  .card-media img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .card-badge{position:absolute; top:.8rem; left:.8rem; z-index:2; background:var(--coral); color:#fff; font-size:.7rem; font-weight:800; letter-spacing:.03em; padding:.4rem .7rem; border-radius:.5rem; box-shadow:0 6px 16px rgba(192,79,76,.3);}
  .card-body{padding:1.1rem 1.2rem 1.3rem; display:flex; flex-direction:column; gap:.5rem; flex:1;}
  .card-cat{font-size:.65rem; letter-spacing:.15em; text-transform:uppercase; color:var(--sage); font-weight:700;}
  .card-name{font-family:'Playfair Display',serif; font-weight:700; font-size:1.02rem; line-height:1.25;}
  .card-footer{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:.6rem;}
  .price-wrap{display:flex; flex-direction:column;}
  .card-price-old{font-size:.78rem; color:#a99fb0; text-decoration:line-through;}
  .card-price{font-family:'Playfair Display',serif; font-weight:800; font-size:1.25rem; color:var(--coral);}
  .card-price.no-discount{color:var(--purple);}
  .add-btn{width:38px; height:38px; border-radius:50%; background:var(--ink); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s; flex-shrink:0;}
  .add-btn:hover{background:var(--purple);}
  .out-stock{font-size:.7rem; color:#e53e3e; font-weight:700; margin-top:.2rem;}

  .empty-block{grid-column:1/-1; text-align:center; padding:3rem; color:#a99fb0; font-size:.9rem;}

  /* MODAL DETALLE DE PRODUCTO */
  .modal-overlay{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(43,31,51,.6); display:none; align-items:center; justify-content:center; z-index:1000; padding:1.5rem;}
  .modal-overlay.open{display:flex;}
  .product-modal{background:#fff; border-radius:1.3rem; width:100%; max-width:880px; max-height:90vh; overflow-y:auto; display:grid; grid-template-columns:1fr 1.1fr;}
  .pm-media{background:#E8E2D8; min-height:320px; display:flex; align-items:center; justify-content:center; position:relative;}
  .pm-media img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .pm-close{position:absolute; top:1rem; right:1rem; z-index:2; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.9); border:none; cursor:pointer; font-size:1rem; color:var(--ink);}
  .pm-body{padding:2rem;}
  .pm-cat{font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:var(--sage); font-weight:700;}
  .pm-name{font-family:'Playfair Display',serif; font-weight:700; font-size:1.5rem; margin:.5rem 0;}
  .pm-desc{font-size:.88rem; color:#5c5460; line-height:1.65; margin-bottom:1.2rem;}
  .pm-price-row{display:flex; align-items:baseline; gap:.8rem; margin-bottom:1.3rem;}
  .pm-price-old{font-size:.95rem; color:#a99fb0; text-decoration:line-through;}
  .pm-price{font-family:'Playfair Display',serif; font-weight:800; font-size:1.8rem; color:var(--coral);}
  .pm-ing-title{font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; color:var(--ink); font-weight:700; margin:1.5rem 0 .8rem;}
  .pm-ing-list{display:flex; flex-direction:column; gap:.7rem; margin-bottom:1.3rem;}
  .pm-ing-item{display:flex; gap:.8rem; align-items:flex-start;}
  .pm-ing-icon{width:32px; height:32px; border-radius:50%; background:#F5EEF7; color:var(--purple); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:.8rem;}
  .pm-ing-item h5{font-size:.85rem; margin-bottom:.15rem;}
  .pm-ing-item p{font-size:.78rem; color:#8a8090;}
  .pm-add-row{display:flex; gap:.8rem; align-items:center; margin-top:1.5rem;}
  .qty-box{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:.7rem; overflow:hidden;}
  .qty-box button{width:36px; height:42px; border:none; background:#fff; cursor:pointer; font-weight:700;}
  .qty-box span{width:36px; text-align:center; font-size:.9rem; font-weight:600;}
  .pm-add-btn{flex:1; padding:.9rem; border-radius:.7rem; background:var(--ink); color:#fff; border:none; font-weight:600; font-size:.9rem; cursor:pointer;}
  .pm-add-btn:hover{background:var(--purple);}

  footer{text-align:center; padding:2.5rem 1rem; color:#a99fb0; font-size:.8rem; border-top:1px solid var(--line);}

  .toast{position:fixed; bottom:2rem; right:2rem; padding:1rem 1.5rem; border-radius:.75rem; color:#fff; font-weight:600; font-size:.875rem; display:flex; align-items:center; gap:.75rem; box-shadow:0 4px 20px rgba(0,0,0,.2); transform:translateY(100px); opacity:0; transition:all .3s; z-index:9999;}
  .toast.show{transform:translateY(0); opacity:1;}
  .toast-success{background:#38a169;}

  @media(max-width:960px){
    .shop{grid-template-columns:1fr;}
    .filters{display:flex; flex-wrap:wrap; gap:1rem;}
    .filters h3{width:100%; margin-top:1rem;}
    .product-grid{grid-template-columns:repeat(2,1fr);}
    .nav{padding:1rem 1.5rem;}
    .page-header, .shop{padding-left:1.5rem; padding-right:1.5rem;}
  }
  @media(max-width:600px){
    .nav-links{display:none; position:absolute; top:100%; left:0; right:0; background:#fff; flex-direction:column; padding:1rem 1.5rem; border-bottom:1px solid var(--line); gap:1.1rem;}
    .nav-links.open{display:flex;}
    .nav-toggle{display:block;}
    .product-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">
    <img src="asents/logo.svg.png" alt="Lili Organic" onerror="this.style.display='none'">
  </a>
  <div class="nav-links" id="navLinks">
    <a href="index.html" data-i18n="nav_inicio">Inicio</a>
    <a href="tienda.html" class="on" data-i18n="nav_tienda">Tienda</a>
    <a href="nosotros.html" data-i18n="nav_nosotros">Nosotros</a>
    <a href="beneficios.html" data-i18n="nav_beneficios">Beneficios</a>
    <a href="contacto.html" data-i18n="nav_contacto">Contacto</a>
  </div>
  <div class="nav-icons">
    <div id="marketSwitcherContainer"></div>
    <a href="carrito.html" class="cart-dot">
      <i class="fas fa-shopping-bag"></i>
      <span class="badge-count" id="cartCount">0</span>
    </a>
    <i class="fas fa-bars nav-toggle" id="navToggle"></i>
  </div>
</nav>

<div class="page-header">
  <div class="eyebrow" data-i18n="shop_eyebrow">Catálogo completo</div>
  <h1 data-i18n="shop_title">Nuestros Productos</h1>
</div>

<section class="shop">
  <aside class="filters">
    <h3 data-i18n="shop_filter_categoria">Categoría</h3>
    <div class="filter-group" id="catFilters">
      <button class="filter-item active" data-cat="all"><span data-i18n="shop_all">Todas</span> <span class="count" id="count-all">-</span></button>
    </div>

    <div class="filter-divider"></div>
    <h3 data-i18n="shop_sort">Ordenar</h3>
    <select class="sort-select" id="sortSelect" style="width:100%;">
      <option value="destacado" data-i18n="shop_sort_featured">Destacados</option>
      <option value="precio-asc" data-i18n="shop_sort_price_asc">Precio: menor a mayor</option>
      <option value="precio-desc" data-i18n="shop_sort_price_desc">Precio: mayor a menor</option>
      <option value="nombre" data-i18n="shop_sort_name">Nombre A-Z</option>
    </select>
  </aside>

  <div>
    <input type="text" class="search-input" id="searchInput" data-i18n-placeholder="shop_search" placeholder="Buscar producto...">
    <div class="grid-header">
      <div>
        <h2 id="resultTitle">Todos los productos</h2>
        <p id="resultCount">Cargando...</p>
      </div>
    </div>
    <div class="product-grid" id="productGrid">
      <div class="empty-block"><i class="fas fa-spinner fa-spin"></i> Cargando productos...</div>
    </div>
  </div>
</section>

<footer>&copy; 2026 Lili Organic &mdash; 829-210-1162 &middot; info@liliorganic.com</footer>

<div class="modal-overlay" id="productModal">
  <div class="product-modal">
    <div class="pm-media" id="pmMedia">
      <button class="pm-close" onclick="closeProductModal()">&times;</button>
    </div>
    <div class="pm-body" id="pmBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="asents/JS/i18n.js"></script>
<script src="asents/JS/supabase-api.js"></script>
<script src="asents/JS/cart.js"></script>
<script src="asents/JS/main.js"></script>
<script>
document.getElementById('navToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

function localToast(msg) {
  const toast = document.getElementById('toast');
  toast.className = 'toast toast-success show';
  toast.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
  setTimeout(() => toast.classList.remove('show'), 2500);
}

let allProducts = [];
let currentCat = 'all';
let currentSort = 'destacado';
let currentSearch = '';

// leer categoría desde la URL (para los links de "necesidades" del home)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('categoria')) currentCat = urlParams.get('categoria');

async function loadTiendaProducts() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/productos?activo=eq.true&order=id.asc`,
      { headers: HEADERS }
    );
    let data = await res.json();

    // En mercado US, solo mostramos productos con precio_usd definido
    if (getMarket() === 'US') {
      data = data.filter(p => p.precio_usd !== null && p.precio_usd !== undefined);
      await autoTranslateFields(data, ['nombre', 'descripcion', 'uso']);
    }

    allProducts = data;
    buildCategoryFilters();
    renderGrid();
  } catch (err) {
    document.getElementById('productGrid').innerHTML = '<div class="empty-block">Error al cargar los productos.</div>';
  }
}

function buildCategoryFilters() {
  const cats = [...new Set(allProducts.map(p => p.categoria))];
  const container = document.getElementById('catFilters');

  document.getElementById('count-all').textContent = allProducts.length;

  container.innerHTML = `<button class="filter-item ${currentCat === 'all' ? 'active' : ''}" data-cat="all">${t('shop_all')} <span class="count">${allProducts.length}</span></button>` +
    cats.map(c => {
      const count = allProducts.filter(p => p.categoria === c).length;
      return `<button class="filter-item ${currentCat === c ? 'active' : ''}" data-cat="${c}">${catName(c)} <span class="count">${count}</span></button>`;
    }).join('');

  container.querySelectorAll('.filter-item').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      container.querySelectorAll('.filter-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    });
  });
}

function renderGrid() {
  let filtered = allProducts.filter(p => currentCat === 'all' || p.categoria === currentCat);

  if (currentSearch) {
    const s = currentSearch.toLowerCase();
    filtered = filtered.filter(p =>
      productText(p, 'nombre').toLowerCase().includes(s) || productText(p, 'descripcion').toLowerCase().includes(s)
    );
  }

  const priceOf = (p) => getMarket() === 'US' ? Number(p.precio_usd) : Number(p.precio);
  if (currentSort === 'precio-asc') filtered.sort((a,b) => priceOf(a) - priceOf(b));
  if (currentSort === 'precio-desc') filtered.sort((a,b) => priceOf(b) - priceOf(a));
  if (currentSort === 'nombre') filtered.sort((a,b) => productText(a,'nombre').localeCompare(productText(b,'nombre')));

  document.getElementById('resultTitle').textContent = currentCat === 'all' ? t('shop_all') : catName(currentCat);
  document.getElementById('resultCount').textContent = `${filtered.length} ${getLang() === 'en' ? 'product' + (filtered.length !== 1 ? 's' : '') : 'producto' + (filtered.length !== 1 ? 's' : '')}`;

  const grid = document.getElementById('productGrid');

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-block">${t('pm_no_results')}</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const pricing = getMarketPricing(p);
    const nombre = productText(p, 'nombre');
    return `
    <div class="card" onclick="openProductModal('${p.id}')" style="cursor:pointer;">
      <div class="card-media">
        ${p.badge ? `<span class="card-badge">${p.badge}</span>` : ''}
        ${p.imagen_url ? `<img src="${p.imagen_url}" alt="${nombre}" onerror="this.style.display='none'">` : nombre}
      </div>
      <div class="card-body">
        <div class="card-cat">${catName(p.categoria)}</div>
        <div class="card-name">${nombre}</div>
        ${p.stock <= 0 ? `<div class="out-stock">${t('shop_out_stock')}</div>` : ''}
        <div class="card-footer">
          <div class="price-wrap">
            ${pricing.precioNormal ? `<span class="card-price-old">${pricing.precioNormal}</span>` : ''}
            <span class="card-price ${pricing.tieneDescuento ? '' : 'no-discount'}">${pricing.precio}</span>
          </div>
          <button class="add-btn" onclick="event.stopPropagation(); addToCart('${p.id}')" ${p.stock <= 0 ? 'disabled style="opacity:.4;cursor:not-allowed;"' : ''}>
            <i class="fas fa-plus"></i>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('sortSelect').addEventListener('change', (e) => {
  currentSort = e.target.value;
  renderGrid();
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  currentSearch = e.target.value;
  renderGrid();
});

// ============================================================
// MODAL DE DETALLE DE PRODUCTO
// ============================================================
let modalQty = 1;

async function openProductModal(id) {
  const p = allProducts.find(x => String(x.id) === String(id));
  if (!p) return;

  modalQty = 1;
  const pricing = getMarketPricing(p);
  const nombre = productText(p, 'nombre');
  const descripcion = productText(p, 'descripcion');
  const uso = productText(p, 'uso');

  document.getElementById('pmMedia').innerHTML = `
    <button class="pm-close" onclick="closeProductModal()">&times;</button>
    ${p.imagen_url ? `<img src="${p.imagen_url}" alt="${nombre}">` : ''}
  `;

  document.getElementById('pmBody').innerHTML = `
    <div class="pm-cat">${catName(p.categoria)}</div>
    <div class="pm-name">${nombre}</div>
    <div class="pm-desc">${descripcion}</div>
    <div class="pm-price-row">
      ${pricing.precioNormal ? `<span class="pm-price-old">${pricing.precioNormal}</span>` : ''}
      <span class="pm-price">${pricing.precio}</span>
    </div>
    ${uso ? `<p style="font-size:.82rem; color:#8a8090;"><strong>${t('pm_usage')}:</strong> ${uso}</p>` : ''}
    <div id="pmIngredientes"></div>
    <div class="pm-add-row">
      <div class="qty-box">
        <button onclick="changeModalQty(-1)">-</button>
        <span id="modalQtyDisplay">1</span>
        <button onclick="changeModalQty(1)">+</button>
      </div>
      <button class="pm-add-btn" onclick="addFromModal('${p.id}')" ${p.stock <= 0 ? 'disabled style="opacity:.5;"' : ''}>
        ${p.stock <= 0 ? t('shop_out_stock') : `<i class="fas fa-shopping-bag"></i> ${t('shop_add_cart')}`}
      </button>
    </div>
  `;

  document.getElementById('productModal').classList.add('open');
  loadProductIngredients(p.id);
}

function changeModalQty(delta) {
  modalQty = Math.max(1, modalQty + delta);
  document.getElementById('modalQtyDisplay').textContent = modalQty;
}

function addFromModal(id) {
  for (let i = 0; i < modalQty; i++) addToCart(id);
  closeProductModal();
}

function closeProductModal() {
  document.getElementById('productModal').classList.remove('open');
}

async function loadProductIngredients(productoId) {
  const container = document.getElementById('pmIngredientes');
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/producto_ingredientes?producto_id=eq.${productoId}&order=orden.asc`,
      { headers: HEADERS }
    );
    const ingredientes = await res.json();

    if (ingredientes.length === 0) {
      container.innerHTML = '';
      return;
    }

    await autoTranslateFields(ingredientes, ['ingrediente', 'beneficio']);

    container.innerHTML = `
      <div class="pm-ing-title">${t('pm_ingredients_title')}</div>
      <div class="pm-ing-list">
        ${ingredientes.map(ing => `
          <div class="pm-ing-item">
            <div class="pm-ing-icon"><i class="fas fa-leaf"></i></div>
            <div><h5>${productText(ing, 'ingrediente')}</h5><p>${productText(ing, 'beneficio')}</p></div>
          </div>
        `).join('')}
      </div>
    `;
  } catch (err) {
    container.innerHTML = '';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderMarketSwitcher('marketSwitcherContainer');
  applyI18n();
  loadTiendaProducts();
});
</script>

</body>
</html>
